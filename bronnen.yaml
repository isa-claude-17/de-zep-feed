# ─────────────────────────────────────────────────────────────
#  Bronnen voor het sportscherm
#  Een nieuwe bron toevoegen = een blokje hieronder kopiëren en aanpassen.
#  Tijdelijk uitzetten = aan: false
# ─────────────────────────────────────────────────────────────

instellingen:
  max_koppen_per_bron: 5     # hoeveel koppen per kaart
  max_tekens_kop: 90         # langere koppen worden ingekort met …
  max_leeftijd_dagen: 14     # oudere berichten laten we weg

bronnen:

  # Weer via Open-Meteo (gratis, zonder sleutel). Plaats en coördinaten hier aanpassen.
  - id: weer
    type: weer
    naam: Weer
    plaats: Koudekerk aan den Rijn
    lat: 52.21
    lon: 4.66
    aan: true

  - id: schaatsen
    type: rss
    naam: Schaatsen
    kleur: "#4FC3F7"         # lichtblauw
    url: https://feeds.nos.nl/nossportschaatsen
    aan: true

  - id: wielrennen
    type: rss
    naam: Wielrennen
    kleur: "#FFB300"         # geel/oranje
    url: https://feeds.nos.nl/nossportwielrennen
    aan: true

  - id: voetbal
    type: rss
    naam: Voetbal
    kleur: "#E53935"
    url: https://feeds.nos.nl/nosvoetbal
    aan: true

  - id: nieuws
    type: rss
    naam: Nieuws
    kleur: "#90A4AE"
    url: https://feeds.nos.nl/nosnieuwsalgemeen
    aan: true

  - id: nasa
    type: rss
    naam: NASA
    kleur: "#90A4AE"
    url: https://www.nasa.gov/news-release/feed/
    aan: true

  # Satire. Weinig berichten per dag maar lange koppen, dus minder koppen met meer regels.
  # Optioneel per bron:  koppen (aantal op het scherm), regels (per kop),
  # max_tekens_kop (overschrijft de instelling bovenaan) en
  # zonder_categorie (berichten met zo'n categorie laten we weg, bijv. advertorials).
  - id: speld
    type: rss
    naam: De Speld
    url: https://speld.nl/feed/
    koppen: 3
    regels: 3
    max_tekens_kop: 140
    zonder_categorie: [Advertorial, Campagne]
    aan: true

  # On this day (onthisday.com, Engelstalig). Elke feed heeft één bericht per dag, dus de server
  # haalt hem maar één keer per dag op. Van de 8 tot 10 regels kiest hij er 5, gelijkmatig
  # verdeeld van oud naar nieuw. Met  europa: true  komen regels met een Europees woord
  # (of Nederland/België) eerst; staat nu uit omdat bekende Amerikanen dan wegvallen.
  # De volgorde van de schermen is de volgorde in dit bestand.
  - id: gebeurd
    type: opdezedag
    soort: gebeurd
    naam: On this day
    url: https://www.onthisday.com/rss/historical-events.xml
    koppen: 5
    regels: 2
    max_tekens_kop: 105
    aan: true

  - id: geboren
    type: opdezedag
    soort: geboren
    naam: On this day - born
    url: https://www.onthisday.com/rss/famous-birthdays.xml
    koppen: 5
    regels: 2
    max_tekens_kop: 105
    aan: true

  - id: overleden
    type: opdezedag
    soort: overleden
    naam: On this day - died
    url: https://www.onthisday.com/rss/famous-deaths.xml
    koppen: 5
    regels: 2
    max_tekens_kop: 105
    aan: true

  # Voorbeelden voor later, staan nog uit:

  - id: f1
    type: rss
    naam: Formule 1
    kleur: "#EF5350"
    url: https://feeds.nos.nl/nossportformule1
    aan: false

  - id: casino
    type: rss
    naam: iGaming
    kleur: "#AB47BC"
    url: https://www.casino.org/news/feed/
    aan: false

  - id: uitspraak
    type: uitspraken
    naam: Uitspraak van de dag
    kleur: "#F5F5F5"
    # Google Sheet "Sportscherm – uitspraken van de dag" (eerste tabblad als CSV)
    url: https://docs.google.com/spreadsheets/d/11e4tsVDh_-3qzh9QFzE5Clhpy5-zk5zEwQG-73yZY0w/export?format=csv
    bestand: uitspraken.csv  # reserve als de Sheet even niet bereikbaar is
    aan: true
