<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sportscherm preview</title>
<style>
  /*
   VOICE   rustig met karakter: elk onderwerp herkenbaar aan kleur en tekening
   IDEA    een bureauwidget met per sport een eigen 'ondergrond' (ijsbaan, weg, veld, krant, heelal)
   PICTURE het 480x320 scherm zelf, groot in beeld
   COLOUR  per onderwerp een basis + gloed; de band bovenin fel, de rest donker en doorschijnend
   LAYOUT  band 78px met klok en titel, daaronder 4 koppen
  */
  :root { --b: 480px; --h: 320px; --band: 78px; }
  * { box-sizing: border-box; margin: 0; padding: 0; min-width: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         gap: 20px; padding: 24px 12px; background: #d9d4cc; color: #2b2925;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .kast { background: #151517; border-radius: 18px; padding: 18px 22px; transform-origin: top center;
          box-shadow: 0 30px 60px -20px rgba(0,0,0,.45), inset 0 0 0 2px #262629; }
  .scherm { width: var(--b); height: var(--h); position: relative; overflow: hidden; border-radius: 2px;
            background: #07080b; color: #fff; cursor: pointer; }

  /* ── kaart: lagen van onder naar boven ── */
  .kaart { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; background: var(--base); }
  .kaart.zichtbaar { opacity: 1; }
  /* 1. zachte gloed over het hele scherm */
  .kaart::before { content: ""; position: absolute; inset: 0;
      background: radial-gradient(90% 70% at 80% 0%, color-mix(in srgb, var(--g2) 55%, transparent), transparent 75%); }
  /* 2. de tekening over het hele scherm */
  .tekening { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--lijn); }
  /* 3. de felle band bovenin, half doorzichtig zodat de tekening doorloopt */
  .band { position: absolute; inset: 0 0 auto 0; height: var(--band);
      background: linear-gradient(100deg, color-mix(in srgb, var(--g2) 92%, transparent) 0%, color-mix(in srgb, var(--g1) 82%, transparent) 100%);
      box-shadow: 0 1px 0 rgba(255,255,255,.18), 0 8px 24px -8px color-mix(in srgb, var(--g1) 60%, transparent); }
  .band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.18), transparent 60%); }
  .tekening.fel { -webkit-mask: linear-gradient(#000 0 var(--band), transparent var(--band)); mask: linear-gradient(#000 0 var(--band), transparent var(--band));
      color: rgba(255,255,255,.42); }
  /* 4. doorschijnende laag onder de tekst */
  .inhoudlaag { position: absolute; inset: var(--band) 0 0 0;
      background: linear-gradient(180deg, color-mix(in srgb, var(--base) 20%, transparent), color-mix(in srgb, var(--base) 45%, transparent)); }

  /* ── band-inhoud ── */
  .boven { position: absolute; z-index: 3; inset: 0 0 auto 0; height: 26px; display: flex; align-items: center;
           justify-content: space-between; padding: 0 12px; font-size: 11.5px; color: rgba(255,255,255,.78); }
  .boven .klok { font-size: 16px; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .boven .rechts { display: flex; gap: 8px; align-items: center; }
  .boven .klein { font-size: 10px; color: rgba(255,255,255,.55); }
  .wifi { width: 13px; height: 9px; fill: rgba(255,255,255,.75); }
  .titelrij { position: absolute; z-index: 3; left: 14px; right: 14px; top: 28px; height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .titel { font-size: 29px; font-weight: 800; letter-spacing: -.5px; line-height: 1; text-shadow: 0 1px 10px rgba(0,0,0,.25); }
  .sub { font-size: 11.5px; font-weight: 650; color: rgba(255,255,255,.9); text-align: right; line-height: 1.25; white-space: nowrap; }
  .sub b { display: block; font-size: 18px; font-weight: 750; color: #fff; }

  /* ── koppen ── */
  ul { list-style: none; position: absolute; z-index: 3; inset: calc(var(--band) + 6px) 14px 8px 14px;
       display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: baseline; }
  li + li { padding-top: 8px; border-top: 1px solid rgba(255,255,255,.09); }
  .wanneer { font-size: 10.5px; font-weight: 600; color: var(--acc); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kop-t { font-size: 14px; line-height: 1.22; color: rgba(255,255,255,.84); display: -webkit-box; -webkit-line-clamp: 1;
           -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  li:first-child .kop-t { font-size: 15.5px; font-weight: 650; color: #fff; -webkit-line-clamp: 2; }
  /* kaart met eigen indeling (koppen/regels uit de feed): alle koppen even groot en meer regels */
  ul.ruim li .kop-t { font-size: 15px; line-height: 1.24; color: rgba(255,255,255,.9); -webkit-line-clamp: var(--regels, 3); }
  ul.ruim li:first-child .kop-t { font-size: 15px; font-weight: 650; color: #fff; }
  /* lijst met jaartallen (op deze dag): 5 regels van 2 regels tekst, jaartal in de accentkleur */
  ul.jaar { gap: 5px; }
  ul.jaar li { grid-template-columns: 46px 1fr; }
  ul.jaar li + li { padding-top: 5px; }
  ul.jaar .wanneer { font-size: 13px; font-weight: 750; }
  ul.jaar li .kop-t, ul.jaar li:first-child .kop-t { font-size: 14px; line-height: 1.2; font-weight: 400; color: rgba(255,255,255,.9); }

  /* ── weer ── */
  .weer { position: absolute; z-index: 3; inset: calc(var(--band) + 8px) 14px 10px; display: grid; grid-template-columns: 1fr 156px; gap: 14px; }
  .weer-nu { display: flex; flex-direction: column; justify-content: center; }
  .temp { font-size: 78px; font-weight: 300; line-height: .95; letter-spacing: -3px; font-variant-numeric: tabular-nums; text-shadow: 0 2px 14px rgba(0,0,0,.35); }
  .oms { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 17px; font-weight: 650; }
  .oms svg { width: 28px; height: 28px; flex: none; color: var(--acc); }
  .det { margin-top: 6px; font-size: 12.5px; line-height: 1.5; color: rgba(255,255,255,.78); text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .weer-dagen { display: flex; flex-direction: column; gap: 7px; justify-content: center; }
  .dagrij { display: grid; grid-template-columns: 30px 26px 1fr; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px;
            background: color-mix(in srgb, var(--base) 55%, transparent); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .dagrij .dag { font-size: 13px; font-weight: 700; color: var(--acc); }
  .dagrij svg { width: 24px; height: 24px; color: rgba(255,255,255,.9); }
  .dagrij .gr { text-align: right; font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dagrij .gr small { font-size: 12px; font-weight: 500; color: rgba(255,255,255,.6); margin-left: 4px; }

  /* ── uitspraak ── */
  .q-onder { position: absolute; z-index: 3; inset: calc(var(--band) + 10px) 26px 14px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .citaat { font-family: Georgia, "Times New Roman", serif; font-size: 23px; font-weight: 600; line-height: 1.28; text-wrap: balance; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .wie { display: flex; align-items: center; gap: 9px; font-size: 13px; color: rgba(255,255,255,.8); }
  .foto { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700;
          background: color-mix(in srgb, var(--g1) 35%, transparent); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }

  .voortgang { position: absolute; z-index: 6; left: 0; bottom: 0; height: 2px; width: 0; background: var(--acc, #fff); opacity: .75; }

  /* ── bediening (alleen preview) ── */
  .bediening { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; }
  .bediening button { border: 0; background: #fff; color: #222; padding: 9px 13px; min-height: 40px; border-radius: 9px; font: inherit; cursor: pointer;
                      box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .bediening button.aan { background: #222; color: #fff; }
  .bediening button:focus-visible { outline: 2px solid #222; outline-offset: 2px; }
  .sep { width: 10px; }
  .noot { max-width: 580px; text-align: center; font-size: 12.5px; color: #5c574f; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .kaart { transition: none; } }
</style>
</head>

      const kolom = (x, y, w, n) => Array.from({ length: n }, (_, i) => `<line x1="${x}" y1="${y + i * 11}" x2="${x + (i % 5 === 4 ? w * .55 : w)}" y2="${y + i * 11}"/>`).join("");
      return svg(`
        <g stroke-width="2.2"><line x1="18" y1="72" x2="462" y2="72"/><line x1="18" y1="76" x2="462" y2="76"/></g>
        <g stroke-width="1.6" stroke-linecap="round">${kolom(18, 82, 130, 20)}${kolom(330, 82, 132, 20)}${kolom(175, 186, 130, 11)}</g>
        <rect x="175" y="82" width="130" height="86" stroke-width="1.6"/>
        <path d="M175 168 l40 -40 30 26 25 -18 35 32" stroke-width="1.4"/>
        <g stroke-width="1.2"><line x1="162" y1="82" x2="162" y2="300"/><line x1="318" y1="82" x2="318" y2="300"/></g>`);
    }
    case "speld": {
      // een krantenpagina, een beetje scheef, met een grote speld erdoor en een ezelsoor
      const regel = (x, y, w, n) => Array.from({ length: n }, (_, i) => `<line x1="${x}" y1="${y + i * 12}" x2="${x + (i % 4 === 3 ? w * .5 : w)}" y2="${y + i * 12}"/>`).join("");
      return svg(`
        <g transform="rotate(-6 240 175)">
          <path d="M70 34 H410 V300 H104 L70 266 Z" stroke-width="2"/>
          <path d="M70 266 L104 266 L104 300" stroke-width="1.6"/>
          <g stroke-width="2.4"><line x1="86" y1="56" x2="394" y2="56"/></g>
          <g stroke-width="1"><line x1="86" y1="64" x2="394" y2="64"/></g>
          <rect x="86" y="76" width="150" height="92" stroke-width="1.6"/>
          <path d="M86 168 l42 -38 30 24 26 -16 52 30" stroke-width="1.3"/>
          <circle cx="206" cy="98" r="9" stroke-width="1.3"/>
          <g stroke-width="1.5" stroke-linecap="round">${regel(250, 80, 144, 18)}${regel(86, 182, 150, 9)}</g>
          <line x1="243" y1="76" x2="243" y2="296" stroke-width="1"/>
        </g>
        <g stroke-linecap="round">
          <line x1="296" y1="36" x2="266" y2="78" stroke-width="2.6"/>
          <line x1="266" y1="78" x2="232" y2="126" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>
          <line x1="232" y1="126" x2="218" y2="146" stroke-width="2.6"/>
          <circle cx="266" cy="78" r="3.5" fill="currentColor" stroke="none"/>
          <circle cx="232" cy="126" r="3.5" fill="currentColor" stroke="none"/>
        </g>
        <circle cx="304" cy="26" r="14" fill="currentColor" stroke="none" opacity=".55"/>
        <circle cx="304" cy="26" r="14" stroke-width="2"/>
        <path d="M297 20 a8 8 0 0 1 9 -3" stroke-width="1.6" opacity=".9"/>`);
    }
    case "kalender": {
      // afscheurkalender: blad met spiraalringen, een rooster van dagen en een omcirkelde dag
      const ringen = [170, 240, 310, 380].map(x => `<line x1="${x}" y1="52" x2="${x}" y2="78" stroke-width="5"/>`).join("");
      const dagen = Array.from({ length: 28 }, (_, i) => {
        const x = 148 + (i % 7) * 34, y = 124 + Math.floor(i / 7) * 40;
        return i === 17 ? `<rect x="${x}" y="${y}" width="24" height="24" rx="6" fill="currentColor" stroke="none" opacity=".5"/><rect x="${x - 3}" y="${y - 3}" width="30" height="30" rx="9" stroke-width="2"/>`
                        : `<rect x="${x}" y="${y}" width="24" height="24" rx="6" stroke-width="1.2" opacity=".75"/>`;
      }).join("");
      return svg(`<g transform="rotate(4 270 190)">
          <rect x="132" y="64" width="276" height="236" rx="14" stroke-width="2"/>
          <line x1="132" y1="110" x2="408" y2="110" stroke-width="2"/>
          <g stroke-linecap="round">${ringen}</g>
          ${dagen}
        </g>
        <g stroke-width="1.6" opacity=".7"><circle cx="64" cy="250" r="30"/><path d="M64 250V230M64 250l14 8"/></g>`);
    }
    case "taart": {
      const kaarsjes = [196, 240, 284].map(x => `<line x1="${x}" y1="150" x2="${x}" y2="178" stroke-width="3"/><path d="M${x} 130c-7 8-7 14 0 18c7-4 7-10 0-18z" fill="currentColor" stroke="none" opacity=".75"/>`).join("");
      const ballon = (x, y, rx, ry) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" stroke-width="2"/><path d="M${x} ${y + ry}q-8 24 4 50t-2 60" stroke-width="1.3" opacity=".8"/><path d="M${x - rx * .45} ${y - ry * .4}a${rx * .5} ${ry * .5} 0 0 1 ${rx * .3} ${-ry * .25}" stroke-width="1.4" opacity=".8"/>`;
      const confetti = Array.from({ length: 16 }, (_, i) => { const x = 20 + (i * 83) % 440, y = 96 + (i * 61) % 200; return `<rect x="${x}" y="${y}" width="6" height="3" rx="1" transform="rotate(${i * 37} ${x} ${y})" fill="currentColor" stroke="none" opacity=".6"/>`; }).join("");
      return svg(`${confetti}
        <g stroke-linecap="round">${kaarsjes}</g>
        <path d="M150 190h180v82h-180z" stroke-width="2"/>
        <path d="M150 190c15 14 30 14 45 0s30 14 45 0 30 14 45 0 30 14 45 0" stroke-width="2"/>
        <path d="M150 232h180" stroke-width="1.2" stroke-dasharray="6 5"/>
        <path d="M126 272h228" stroke-width="2.2"/>
        ${ballon(400, 148, 26, 32)}${ballon(86, 168, 22, 28)}`);
    }
    case "kaars": {
      // een brandende kaars met stralenkrans, rustig en sober
      const kransen = [34, 62, 96].map((r, i) => `<circle cx="300" cy="150" r="${r}" stroke-width="1.2" stroke-dasharray="${i ? "3 7" : "none"}" opacity="${.9 - i * .2}"/>`).join("");
      const sterren = [[60, 120], [110, 230], [180, 150], [420, 260], [450, 120], [372, 190]].map(([x, y], i) => `<path d="M${x} ${y - 6}v12M${x - 6} ${y}h12" stroke-width="1.2" opacity="${.5 + (i % 3) * .15}"/>`).join("");
      return svg(`${kransen}${sterren}
        <path d="M300 122c-13 16-13 30 0 38c13-8 13-22 0-38z" fill="currentColor" stroke="none" opacity=".6"/>
        <path d="M300 122c-13 16-13 30 0 38c13-8 13-22 0-38z" stroke-width="2"/>
        <line x1="300" y1="160" x2="300" y2="172" stroke-width="2"/>
        <path d="M274 176h52v110h-52z" stroke-width="2"/>
        <path d="M274 176c0 10 8 10 8 0M286 176c0 16 10 16 10 0M306 176c0 8 6 8 6 0" stroke-width="1.6"/>
        <path d="M244 286h112" stroke-width="2.2"/>`);
    }
    case "heelal": {
      return svg(`
        <g fill="currentColor" stroke="none">${STERREN.map(([x, y, r]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}"/>`).join("")}</g>
        <ellipse cx="240" cy="190" rx="300" ry="120" stroke-width="1" stroke-dasharray="2 6"/>
        <ellipse cx="240" cy="190" rx="200" ry="74" stroke-width="1" opacity=".8"/>
        <circle cx="320" cy="44" r="22" stroke-width="2"/>
        <path d="M300 38 q20 6 40 0" stroke-width="1" opacity=".7"/>
        <ellipse cx="320" cy="44" rx="42" ry="9" stroke-width="1.6" transform="rotate(-16 320 44)"/>
        <circle cx="90" cy="240" r="9" stroke-width="1.6"/>
        <path d="M40 300 Q 160 210 300 130" stroke-width="1.4" stroke-dasharray="4 5"/>
        <path d="M300 130 l-4 10 l12 -12 l-14 2 z" fill="currentColor" stroke="none"/>`);
    }
    case "weer": {
      const wolk = (x, y, k) => `<path transform="translate(${x} ${y}) scale(${k})" d="M8 22h15a5 5 0 0 0 .6-9.96A7.5 7.5 0 0 0 9.4 13.1 4.6 4.6 0 0 0 8 22z" stroke-width="${2 / k}"/>`;
      const stralen = Array.from({ length: 14 }, (_, i) => { const a = i * Math.PI / 7, x = 392 + Math.cos(a) * 46, y = 104 + Math.sin(a) * 46, x2 = 392 + Math.cos(a) * (i % 2 ? 58 : 64), y2 = 104 + Math.sin(a) * (i % 2 ? 58 : 64); return `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }).join("");
      const druppels = Array.from({ length: 18 }, (_, i) => { const x = 40 + (i * 53) % 400, y = 196 + (i * 37) % 100; return `<line x1="${x}" y1="${y}" x2="${x - 5}" y2="${y + 13}" stroke-width="1.6" opacity=".7"/>`; }).join("");
      return svg(`<g stroke-width="2.2"><circle cx="392" cy="104" r="34"/>${stralen}</g>
        ${wolk(210, 96, 6.5)}${wolk(20, 150, 4.5)}${wolk(330, 184, 5.5)}
        <g stroke-linecap="round">${druppels}</g>
        <g stroke-width="1.2" opacity=".8">${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<line x1="14" y1="${96 + i * 28}" x2="${i % 2 ? 24 : 32}" y2="${96 + i * 28}"/>`).join("")}</g>`);
    }
    case "citaat": {
      const regels = Array.from({ length: 12 }, (_, i) => `<line x1="0" y1="${100 + i * 20}" x2="480" y2="${100 + i * 20}"/>`).join("");
      return svg(`<g stroke-width=".8">${regels}</g>
        <text x="300" y="300" font-family="Georgia,serif" font-size="330" font-weight="700" fill="currentColor" stroke="none" opacity=".7">”</text>`);
    }
  }
  return "";
}

const DAGEN = ["zo","ma","di","wo","do","vr","za"];
const MAANDEN = ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const DUUR = 9000;
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

let feed = VOORBEELD, volgorde = [], plek = 0, gepauzeerd = false, start = 0;
const scherm = document.getElementById("scherm"), box = document.getElementById("kaarten"), balk = document.getElementById("voortgang");

const nu = () => feed === VOORBEELD ? feed.bijgewerkt * 1000 : Date.now();
function geleden(ts) {
  const min = Math.max(0, Math.round((nu() - ts * 1000) / 60000));
  if (min < 60) return min + " min";
  const u = Math.round(min / 60);
  if (u < 24) return u + " uur";
  const d = Math.round(u / 24);
  return d === 1 ? "gisteren" : d + " dgn";
}
const vandaag = k => k.items.filter(i => nu() - i.ts * 1000 < 86400000).length;
const initialen = n => esc(String(n || "").split(" ").filter(w => w[0] && w[0] === w[0].toUpperCase()).map(w => w[0]).slice(0, 2).join(""));

function maakVolgorde() {
  /* weer eerst, dan alle nieuws- en lijstkaarten, de uitspraak precies 1 keer per doorloop aan het eind */
  const nieuws = feed.kaarten.filter(k => k.type === "nieuws" || k.type === "lijst");
  const q = feed.kaarten.find(k => k.type === "uitspraak");
  const w = feed.kaarten.find(k => k.type === "weer");
  volgorde = [...(w ? [w] : []), ...nieuws, ...(q ? [q] : [])];
}

/* weercodes (WMO) naar tekst en icoon */
const WEERTEKST = { 0:"Helder", 1:"Overwegend helder", 2:"Half bewolkt", 3:"Bewolkt", 45:"Mist", 48:"Rijpmist", 51:"Lichte motregen", 53:"Motregen", 55:"Zware motregen",
  56:"IJzel", 57:"IJzel", 61:"Lichte regen", 63:"Regen", 65:"Zware regen", 66:"IJzelregen", 67:"IJzelregen", 71:"Lichte sneeuw", 73:"Sneeuw", 75:"Zware sneeuw",
  77:"Sneeuwkorrels", 80:"Lichte buien", 81:"Buien", 82:"Zware buien", 85:"Sneeuwbuien", 86:"Zware sneeuwbuien", 95:"Onweer", 96:"Onweer met hagel", 99:"Onweer met hagel" };
const WOLK = '<path d="M8 22h15a5 5 0 0 0 .6-9.96A7.5 7.5 0 0 0 9.4 13.1 4.6 4.6 0 0 0 8 22z"/>';
function ikoon(c, nacht) {
  const kop = '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">', eind = "</svg>";
  const zon = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}"/>` + Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4; return `<line x1="${(cx + Math.cos(a) * (r + 3)).toFixed(1)}" y1="${(cy + Math.sin(a) * (r + 3)).toFixed(1)}" x2="${(cx + Math.cos(a) * (r + 6)).toFixed(1)}" y2="${(cy + Math.sin(a) * (r + 6)).toFixed(1)}"/>`; }).join("");
  if (c <= 1) return nacht ? `${kop}<path d="M22 19.5A9 9 0 1 1 12.5 8 7 7 0 0 0 22 19.5z"/>${eind}` : `${kop}${zon(16, 16, 5)}${eind}`;
  if (c === 2) return `${kop}${nacht ? '<path d="M14 6.5A5.5 5.5 0 1 0 19.5 13 4.5 4.5 0 0 1 14 6.5z"/>' : zon(11, 10, 3.5)}${WOLK}${eind}`;
  if (c === 3) return `${kop}${WOLK}${eind}`;
  if (c === 45 || c === 48) return `${kop}<line x1="6" y1="11" x2="26" y2="11"/><line x1="4" y1="16" x2="24" y2="16"/><line x1="8" y1="21" x2="28" y2="21"/>${eind}`;
  if (c >= 95) return `${kop}${WOLK}<path d="M16 22l-3 5h5l-2 4" stroke-width="1.8"/>${eind}`;
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return `${kop}${WOLK}<circle cx="11" cy="27" r=".8"/><circle cx="16" cy="29" r=".8"/><circle cx="21" cy="27" r=".8"/>${eind}`;
  return `${kop}${WOLK}<line x1="11" y1="25" x2="9.5" y2="29"/><line x1="16.5" y1="25" x2="15" y2="29"/><line x1="22" y1="25" x2="20.5" y2="29"/>${eind}`;
}
const graden = n => (n < 0 ? "\u2212" : "") + Math.abs(n) + "\u00B0";
function weerHTML(k, t) {
  const n = k.nu, uur = new Date(nu()).getHours(), nacht = uur < 7 || uur >= 20;
  const dagen = k.dagen.map(d => `<div class="dagrij"><span class="dag">${DAGEN[d.d]}</span>${ikoon(d.c, false)}<span class="gr">${graden(d.max)}<small>${graden(d.min)}</small></span></div>`).join("");
  return `${lagen(t)}<div class="titelrij"><span class="titel">Weer</span><span class="sub"><b>${esc(k.plaats)}</b>nu</span></div>
    <div class="weer"><div class="weer-nu"><div class="temp">${graden(n.t)}</div>
      <div class="oms">${ikoon(n.c, nacht)}<span>${esc(WEERTEKST[n.c] || "")}</span></div>
      <div class="det">Voelt als ${graden(n.voelt)} \u00B7 wind ${n.wind} km/u<br>Vandaag ${graden(n.max)} / ${graden(n.min)} \u00B7 ${n.kans}% kans op regen</div></div>
      <div class="weer-dagen">${dagen}</div></div>`;
}

function lagen(t) {
  const tek = tekening(t.tekening);
  return `<div class="tekening">${tek}</div><div class="band"></div><div class="tekening fel">${tek}</div><div class="inhoudlaag"></div>`;
}

function teken() {
  const k = volgorde[plek], t = THEMA[k.id] || THEMA._standaard;
  const css = `--base:${t.base};--g1:${t.g1};--g2:${t.g2};--acc:${t.acc};--lijn:${t.lijn}`;
  let html;
  if (k.type === "weer") {
    html = weerHTML(k, t);
  } else if (k.type === "uitspraak") {
    html = `${lagen(t)}<div class="titelrij"><span class="titel">Uitspraak</span><span class="sub">van de dag</span></div>
      <div class="q-onder"><div class="citaat">${esc(k.tekst)}</div>
      <div class="wie"><span class="foto">${initialen(k.wie)}</span>${esc(k.wie)}</div></div>`;
  } else if (k.type === "lijst") {
    const d = new Date(k.ts * 1000);
    html = `${lagen(t)}<div class="titelrij"><span class="titel">${esc(k.naam)}</span><span class="sub"><b>${d.getDate()} ${MAANDEN[d.getMonth()]}</b></span></div>
      <ul class="ruim jaar" style="--regels:${k.regels || 2}">${k.items.slice(0, k.koppen || 5).map(it => `<li><span class="wanneer">${esc(it.j)}</span><span class="kop-t">${esc(it.t)}</span></li>`).join("")}</ul>`;
  } else {
    const n = vandaag(k);
    const sub = n ? `<b>${n}</b>nieuw vandaag` : `<b>${geleden(k.items[0]?.ts || 0)}</b>laatste bericht`;
    html = `${lagen(t)}<div class="titelrij"><span class="titel">${esc(k.naam)}</span><span class="sub">${sub}</span></div>
      <ul class="ruim" style="--regels:${k.regels || 2}">${k.items.slice(0, k.koppen || 4).map(it => `<li><span class="wanneer">${geleden(it.ts)}</span><span class="kop-t">${esc(it.t)}</span></li>`).join("")}</ul>`;
  }
  box.innerHTML = `<div class="kaart" style="${css}">${html}</div>`;
  scherm.style.setProperty("--acc", t.acc);
  requestAnimationFrame(() => box.firstElementChild.classList.add("zichtbaar"));
  start = performance.now();
}
const volgende = (stap = 1) => { plek = (plek + stap + volgorde.length) % volgorde.length; teken(); };

function lus(tijd) {
  if (!gepauzeerd) {
    const deel = Math.min(1, (tijd - start) / DUUR);
    balk.style.width = (deel * 100) + "%";
    if (deel >= 1) volgende();
  } else start = tijd - (parseFloat(balk.style.width) || 0) / 100 * DUUR;
  requestAnimationFrame(lus);
}

function klok() {
  const d = new Date();
  document.getElementById("klok").textContent = d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
  document.getElementById("datum").textContent = `${DAGEN[d.getDay()]} ${d.getDate()} ${MAANDEN[d.getMonth()]}`;
}
function zoom(f) {
  const kast = document.getElementById("kast");
  kast.style.transform = `scale(${f})`; kast.style.marginBottom = `${(f - 1) * 356}px`;
  document.querySelectorAll("[data-zoom]").forEach(b => b.classList.toggle("aan", +b.dataset.zoom === f));
}

async function laad() {
  try { const r = await fetch("feed.json", { cache: "no-store" }); if (r.ok) feed = await r.json(); } catch (e) {}
  document.getElementById("bijgewerkt").textContent = feed === VOORBEELD ? "voorbeeld" :
    "bijgew. " + new Date(feed.bijgewerkt * 1000).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
  maakVolgorde(); plek = 0; teken();
}

document.getElementById("vorige").onclick = () => volgende(-1);
document.getElementById("volgende").onclick = () => volgende(1);
scherm.onclick = () => volgende(1);
document.getElementById("pauze").onclick = e => { gepauzeerd = !gepauzeerd; e.target.textContent = gepauzeerd ? "Verder" : "Pauze"; e.target.classList.toggle("aan", gepauzeerd); };
document.querySelectorAll("[data-zoom]").forEach(b => b.onclick = () => zoom(+b.dataset.zoom));
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") volgende(1); if (e.key === "ArrowLeft") volgende(-1); });

klok(); setInterval(klok, 10000);
zoom(window.innerWidth > 1100 ? 2 : 1);
laad(); requestAnimationFrame(lus);
}
</script>
</body>
</html>
